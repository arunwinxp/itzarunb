<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arun's Cloud Notebook</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Georgia, serif;
    background: linear-gradient(135deg,#274690,#1b356b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.book{
    position:relative;
    width:900px;
    height:600px;
    perspective:2500px;
}

.page{
    position:absolute;
    width:100%;
    height:100%;
    transform-origin:left center;
    transition:1s;
    transform-style:preserve-3d;
    cursor:pointer;
}

.page.flipped{
    transform:rotateY(-180deg);
}

.front,
.back{
    position:absolute;
    width:100%;
    height:100%;
    background:#fffef8;
    backface-visibility:hidden;
    border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.front{
    padding:50px;
}

.back{
    padding:50px;
    transform:rotateY(180deg);
}

.cover{
    background:linear-gradient(135deg,#3554c7,#274690);
    color:white;
}
